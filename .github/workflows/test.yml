name: Code Test

on:
  push:
    branches:
      - main
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/CustomExtensions/**'
      - 'v2rayN/CustomExtensions.Tests/**'
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'v2rayN/GlobalHotKeys'
      - 'v2rayN/v2rayN.slnx'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/CustomExtensions/**'
      - 'v2rayN/CustomExtensions.Tests/**'
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'v2rayN/GlobalHotKeys'
      - 'v2rayN/v2rayN.slnx'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
        dotnet-quality: 'ga'

    - name: Test Code
      run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx

    - name: Comment PR with results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ./TestResults/*.trx
        comment_mode: failures

  windows-solution:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
        dotnet-quality: 'ga'

    - name: Build solution
      run: dotnet build ./v2rayN/v2rayN.slnx -c Release

    - name: Test solution
      run: dotnet test ./v2rayN/v2rayN.slnx -c Release -- --maximum-parallel-tests 1
