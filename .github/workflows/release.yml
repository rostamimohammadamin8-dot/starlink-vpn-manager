name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows x64 application
        run: dotnet publish ./StarlinkVpnManager/StarlinkVpnManager.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Create release archive
        shell: pwsh
        run: |
          $archiveName = "StarlinkVpnManager-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $archiveName -CompressionLevel Optimal
          "RELEASE_ARCHIVE=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_ARCHIVE }}
