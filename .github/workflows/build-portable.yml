name: Build portable Windows client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Provision pinned core and DB-IP assets
        shell: pwsh
        run: .\Provision-PortableAssets.ps1

      - name: Build and verify portable archive
        shell: pwsh
        run: |
          .\Build-Portable.ps1
          .\Verify-PortableRelease.ps1 -ArchivePath .\Output\v2rayN-Pro-Portable.zip -ManifestPath .\Output\release-manifest.json

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $archive = 'Output/v2rayN-Pro-Portable.zip'
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$checksum  v2rayN-Pro-Portable.zip`n", [Text.Encoding]::ASCII)

      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-release
          path: |
            Output/v2rayN-Pro-Portable.zip
            Output/v2rayN-Pro-Portable.zip.sha256
            Output/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-release
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/v2rayN-Pro-Portable.zip
            dist/v2rayN-Pro-Portable.zip.sha256
            dist/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/v2rayN-Pro-Portable.zip \
            dist/v2rayN-Pro-Portable.zip.sha256 \
            dist/release-manifest.json \
            --clobber
